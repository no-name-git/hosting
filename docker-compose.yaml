services:
  nginx:
    container_name: hmarket_nginx
    image: nginx:alpine
    volumes:
      - ./:/var/www/
      - ./_docker/nginx/conf.d:/etc/nginx/conf.d/
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hmarket.rule=Host(`hmarket.loc`)"
      - "traefik.http.routers.hmarket.entrypoints=web"
      - "traefik.http.services.hmarket.loadbalancer.server.port=80"
    networks:
      - web

  app:
    container_name: hmarket_app
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    volumes:
      - ./:/var/www/
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
    environment:
      DB_CONNECTION: mysql
      DB_HOST: hmarket_db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-ozon}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

  db:
    container_name: hmarket_db
    image: mysql:5.7
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ozon}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    ports:
      - "${MYSQL_PORT:-8101}:3306"
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  mysql_data:

networks:
  web:
    external: true
